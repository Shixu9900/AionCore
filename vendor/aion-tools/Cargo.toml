[package]
name = "aion-tools"
description = "Built-in agent tools for aionrs, with the desktop assistant's file scope."
version = "0.2.11"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iOfficeAI/aionrs"

[dependencies]
aion-types = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-protocol = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-config = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-process = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }

tracing = "0.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
base64 = "0.22"
glob = "0.3"
lru = "0.18"

[dev-dependencies]
tempfile = "3"
